# =====================================================================
#  COD2BOT - Eggdrop side configuration (Tcl)
#  Loaded by scripts/cod2bot/cod2bot.tcl. Keep it in sync with
#  cod2bot/config/cod2bot.ini ([api] port, [general] prefix).
# =====================================================================

namespace eval ::cod2bot {
	# Backend API (Python). Never expose it outside localhost.
	variable api "http://127.0.0.1:8765"

	# File with the shared token (created by the backend on first start /
	# by install.sh). Relative paths are relative to the Eggdrop directory.
	variable tokenfile "cod2bot/data/api.token"

	# Command prefix
	variable prefix "!"

	# Channels: the bot only answers and announces in channels with the
	# flag +cod2   ->   .chanset #yourchannel +cod2   (on the partyline)
	# Channels listed here get +cod2 automatically when the script loads:
	variable enable_chans {}

	# Allow commands by private message (/msg <botnick> !news)
	variable private 1

	# --- Permissions (Eggdrop flags, global|channel) -----------------------
	#  owner = n   admin = m   moderator = o (global) or o (channel)
	#  registered = any user known to the bot (has a handle)
	variable flag_owner "n"
	variable flag_admin "m"
	variable flag_moderator "o|o"
	# Treat channel operators (@) without a handle as moderators? 0 = no
	variable chanop_is_moderator 0

	# --- Anti-flood ------------------------------------------------------
	# Per user (host): max commands in <user_window> seconds
	variable user_max 5
	variable user_window 30
	# Per channel: max replies in <chan_window> seconds
	variable chan_max 8
	variable chan_window 30
	# Users ignored after flooding (seconds)
	variable ignore_time 60

	# --- Output -------------------------------------------------------------
	# Hard caps (the backend already limits; this is a safety net)
	variable max_chan_lines 5
	variable max_notice_lines 12
	# Channels where colours are never used (mode +c is detected automatically)
	variable nocolor_chans {}

	# --- Timers -------------------------------------------------------------
	# Seconds between two announcement polls
	variable poll 15
	# HTTP timeout (ms)
	variable timeout 15000

	# --- Coexistence with service.tcl -----------------------------------------
	# If a user's service.tcl trigger is the same as our prefix and the command
	# also exists in service.tcl (help, version, ...), let service.tcl answer.
	# "!cod2 <command>" always reaches COD2BOT.
	variable yield_to_service 1

	# Commands never sent to the backend (handled by other scripts)
	variable reserved {tcl exec error}

	# 1 = convert text to UTF-8 bytes before sending (only if your Eggdrop
	# shows broken accents/symbols; most 1.9 builds need 0)
	variable utf8_fix 0
}
