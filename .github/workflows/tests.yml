name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install tclsh (Tcl integration test)
        run: sudo apt-get update && sudo apt-get install -y tcl
      - name: Run tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Shell scripts syntax
        run: |
          bash -n install.sh
          bash -n cod2botctl
          bash -n deploy/install-eggdrop.sh
