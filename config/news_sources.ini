; =====================================================================
;  COD2BOT - news sources
;  Every source here was checked on 2026-11-06 (see docs/SOURCES.md).
;  Section name = short source id used in IRC (!news fpschallenge).
;
;  type      : fpschallenge_api | github_releases | rss | atom | feed | html
;  interval  : seconds between polls (respect the site, >= 600 recommended)
;  announce  : yes = post new items automatically in announce channels
;  category  : default category when the classifier finds nothing
;  label     : name shown in IRC
;  colour    : mIRC colour number used for the source label (0-15)
;
;  html sources also need:
;    item_pattern : regex with named groups (?P<url>...) (?P<title>...)
;                   optional (?P<date>...) (?P<image>...) (?P<desc>...)
;    base_url     : used to resolve relative links
;
;  Sources added from IRC with !news addsource are stored in the database.
; =====================================================================

[fpschallenge]
type = fpschallenge_api
label = FPSChallenge
url = https://fpschallenge.eu/api/v1/news
link_template = https://fpschallenge.eu/news/{slug}
; Only keep these FPSChallenge categories (comma separated, empty = all)
categories = Call of Duty 2
; Pages fetched on the first run (backfill, never announced)
initial_pages = 3
interval = 900
announce = yes
category = competitive
colour = 7

; GitHub forbids bots on *.atom (robots.txt "Disallow: /*.atom$"), so releases
; are read from the official REST API (60 requests/hour without token).
[zpam]
type = github_releases
label = zPAM
url = https://api.github.com/repos/eyza-cod2/zpam3/releases?per_page=10
interval = 3600
announce = yes
category = tools
colour = 9

[cod2x]
type = github_releases
label = CoD2x
url = https://api.github.com/repos/callofduty2x/CoD2x/releases?per_page=10
interval = 3600
announce = yes
category = tools
colour = 11

[moddb]
type = rss
label = ModDB
url = https://rss.moddb.com/games/call-of-duty-2/articles/feed/rss.xml
interval = 7200
announce = yes
category = mods
colour = 4

[moddb-files]
type = rss
label = ModDB Files
url = https://rss.moddb.com/games/call-of-duty-2/downloads/feed/rss.xml
interval = 7200
announce = no
category = mods
colour = 4

[moddb-addons]
type = rss
label = ModDB Addons
url = https://rss.moddb.com/games/call-of-duty-2/addons/feed/rss.xml
interval = 7200
announce = no
category = maps
colour = 4

[reddit]
; DISABLED: reddit.com/robots.txt says "User-agent: * / Disallow: /" (checked
; 2026-11-06), so the bot does not fetch it. Kept here as documentation: only
; enable it if Reddit allows it (e.g. with their API and an approved app).
enabled = no
type = atom
label = r/CallofDuty2
url = https://www.reddit.com/r/CallOfDuty2/.rss
interval = 5400
announce = no
category = community
colour = 13
