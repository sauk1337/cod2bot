; =====================================================================
;  COD2BOT - main configuration (backend)
;  IRC connection settings (nick, server, port...) live in eggdrop.conf,
;  because Eggdrop owns the IRC connection. See docs/CONFIG.md.
;  Secrets (API token) go in .env, never here.
; =====================================================================

[general]
; Language for bot messages (only "en" ships with the bot)
language = en
; Timezone used to display dates/times in IRC
timezone = Europe/Berlin
; Short label shown after times
timezone_label = CET
; Command prefix (must match scripts/cod2bot/cod2bot.conf)
prefix = !
bot_name = COD2BOT
version = 1.0.0

[api]
; Local HTTP interface used by the Eggdrop script. Never expose it publicly.
host = 127.0.0.1
port = 8765

[database]
path = data/cod2bot.db
; Days to keep data before automatic cleanup
keep_news_days = 365
keep_server_history_days = 30
keep_admin_logs_days = 180
keep_announcements_days = 14

[backup]
dir = backups
; Daily backup hour (local time, 0-23). -1 disables automatic backups
hour = 5
keep = 14

[logging]
dir = logs
level = INFO
; Rotate when a log reaches this size (MB), keeping N old files
max_mb = 5
backups = 5

[http]
user_agent = COD2BOT/1.0 (+IRC community bot)
timeout = 12
; Minimum seconds between two requests to the same host
min_host_interval = 2
max_bytes = 3000000
respect_robots = yes

[irc]
; Maximum bytes of text per IRC line (IRC limit: 512 incl. prefix)
max_line_bytes = 400
; Maximum lines a command may print in a channel (rest is paginated)
max_channel_lines = 4
; Maximum lines sent by notice/private
max_notice_lines = 10
; Items per page in listings
page_size = 5
; Colors: yes | no (channels with mode +c are stripped automatically)
colors = yes
; If your network mangles UTF-8, set to yes to transliterate to ASCII
ascii_only = no

[theme]
; mIRC colour numbers (0 white, 1 black, 2 navy, 3 green, 4 red, 5 maroon,
; 6 purple, 7 orange, 8 yellow, 9 lime, 10 teal, 11 cyan, 12 blue, 13 pink,
; 14 grey, 15 silver). Leave empty for the default look.
; Badge "[COD2]" text and colours:
brand_text = COD2
brand_fg = 1
brand_bg = 8
; labels / separators / links / ok / error / warning / highlight
label = 14
sep = 14
url = 12
good = 9
bad = 4
warn = 7
accent = 8

[modules]
; Each module can be switched off here or live with !module disable <name>
news = yes
tournaments = yes
servers = yes
cod2 = yes
clans = yes
players = yes
wars = yes
announcer = yes
fun = yes

[announcer]
; Channels that receive automatic announcements (space separated).
; The channel must also have the Eggdrop flag +cod2 (.chanset #chan +cod2).
channels = #yourchannel
; Minimum seconds between two automatic messages in the same channel
min_interval = 90
; Maximum automatic messages per channel per hour
max_per_hour = 12
; What to announce
news = yes
tournaments = yes
wars = yes
servers_down = yes
daily_digest = yes
; Hour of the daily digest (local time)
digest_hour = 20
; Remind wars this many minutes before start (comma separated)
war_reminders = 60,15

[news]
; Default polling interval in seconds (sources may override)
default_interval = 1800
; Only announce items published in the last N hours
announce_max_age_hours = 48
; Do not announce more than N items of one source per run
announce_per_run = 2

[tournaments]
; FPSChallenge tournaments API refresh interval (seconds)
interval = 900
; Games to follow (FPSChallenge gameName values)
games = Call of Duty 2
; Timezone used by FPSChallenge for its dates (assumption, see docs/LIMITATIONS.md)
provider_timezone = Europe/Berlin
; Fetch team/ladder details of tournament teams (rank, ELO, W/L)
fetch_teams = yes
team_refresh_hours = 24
; Announce: registration open, starting soon (minutes before), finished
announce_registration = yes
announce_start_minutes = 60

[servers]
; UDP query timeout (seconds)
timeout = 2.0
; Seconds between status checks of favourite servers
check_interval = 300
; Consecutive failed checks before a server is considered down
down_after = 3
; Minimum seconds between two queries to the same server from IRC
query_cache = 20
; Master server used by !server find / !servers top
master = cod2master.activision.com:20710
; Protocols: 115 = 1.0, 117 = 1.2, 118 = 1.3
master_protocols = 118,117,115
master_cache = 600

[permissions]
; Eggdrop flags mapped to bot levels (global|channel). The Tcl script sends
; the level; these values are documented here and used by cod2bot.conf.
; owner = n   admin = m   moderator = o|o   registered = known handle or Q-auth
registered_requires_qauth = no

[ratelimit]
; Per user: max commands in window seconds (enforced in Tcl and backend)
user_max = 5
user_window = 30
; Same command by the same user: cooldown seconds
command_cooldown = 3
